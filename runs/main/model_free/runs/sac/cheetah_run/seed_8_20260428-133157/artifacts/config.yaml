experiment:
  algorithm: sac
  name: sac_small_compare_dmcontrol
  output_dir: runs/main/model_free/runs/sac
  seed: 8
  device: cuda:0
  resolved_name: sac_small_compare_dmcontrol_cheetah_run
benchmark:
  tasks:
  - id: cartpole_swingup
    suite: dmcontrol
    domain: cartpole
    task: swingup
    action_repeat: 4
    episode_length: 200
  - id: cheetah_run
    suite: dmcontrol
    domain: cheetah
    task: run
    action_repeat: 4
    episode_length: 500
training:
  total_steps: 100000
  seed_steps: 8000
  train_every: 2
  gradient_steps: 1
  batch_size: 128
  replay_capacity: 300000
  eval_interval: 5000
  eval_episodes: 3
  checkpoint_interval: 25000
  discount: 0.99
optim:
  lr: 0.0003
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  target_tau: 0.01
  weight_decay: 0.0
model:
  actor_hidden_dims:
  - 128
  - 128
  critic_hidden_dims:
  - 128
  - 128
algorithm:
  init_temperature: 0.1
  target_entropy_scale: 1.0
  actor_update_interval: 1
  target_update_interval: 1
  learnable_temperature: true
logging:
  console_log_interval: 1000
  episode_log_interval: 10
  progress_interval: 500
  plot_interval: 5000
  enable_plots: true
_config_path: baselines/sac/configs/low_budget_compare_dmcontrol.yaml
task:
  id: cheetah_run
  suite: dmcontrol
  domain: cheetah
  task: run
  action_repeat: 4
  episode_length: 500
