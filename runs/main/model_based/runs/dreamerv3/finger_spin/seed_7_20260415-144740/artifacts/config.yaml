experiment:
  algorithm: dreamerv3
  name: dreamerv3_finger_reacher
  output_dir: runs/main/model_based/runs/dreamerv3
  seed: 7
  device: cuda:0
  resolved_name: dreamerv3_finger_reacher_finger_spin
benchmark:
  tasks:
  - id: finger_spin
    suite: dmcontrol
    domain: finger
    task: spin
    action_repeat: 2
    episode_length: 500
  - id: reacher_easy
    suite: dmcontrol
    domain: reacher
    task: easy
    action_repeat: 4
    episode_length: 200
latent:
  deter_dim: 256
  stoch_size: 16
  classes: 16
  unimix_ratio: 0.01
training:
  total_steps: 100000
  seed_steps: 5000
  train_every: 2
  gradient_steps: 1
  batch_size: 64
  sequence_length: 16
  replay_capacity: 300000
  eval_interval: 5000
  eval_episodes: 3
  checkpoint_interval: 25000
  discount: 0.99
optim:
  lr: 0.0001
  model_lr: 0.0001
  grad_clip: 10.0
  weight_decay: 0.0
  critic_tau: 0.01
model:
  encoder_hidden_dims:
  - 256
  - 256
  embed_dim: 256
  rssm_hidden_dims:
  - 256
  - 256
  decoder_hidden_dims:
  - 256
  - 256
  head_hidden_dims:
  - 256
  - 256
  actor_hidden_dims:
  - 256
  - 256
  critic_hidden_dims:
  - 256
  - 256
  num_bins: 255
  bin_lo: -20.0
  bin_hi: 20.0
behavior:
  actor_lr: 8.0e-05
  critic_lr: 8.0e-05
  imagine_horizon: 8
  lambda_return: 0.95
  entropy_scale: 0.0003
  slow_value_reg: 1.0
  return_percentile_low: 5.0
  return_percentile_high: 95.0
  return_percentile_decay: 0.99
  min_std: 0.1
  max_std: 1.5
  exploration_std: 0.2
losses:
  recon_scale: 1.0
  reward_scale: 1.0
  continue_scale: 1.0
  dyn_scale: 0.5
  rep_scale: 0.1
  free_nats: 1.0
logging:
  console_log_interval: 1000
  episode_log_interval: 10
  progress_interval: 500
  plot_interval: 5000
  enable_plots: true
_config_path: baselines/dreamerv3/configs/finger_reacher.yaml
task:
  id: finger_spin
  suite: dmcontrol
  domain: finger
  task: spin
  action_repeat: 2
  episode_length: 500
