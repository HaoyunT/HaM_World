experiment:
  algorithm: ppo
  name: ppo_walker_pair
  output_dir: outputs
  seed: 7
  device: auto

benchmark:
  tasks:
    - id: walker_walk
      suite: dmcontrol
      domain: walker
      task: walk
      action_repeat: 2
      episode_length: 500
    - id: walker2d_v4
      suite: mujoco
      env_name: Walker2d-v4
      action_repeat: 1
      episode_length: 1000

training:
  total_steps: 100000
  rollout_steps: 2048
  minibatch_size: 256
  update_epochs: 10
  eval_interval: 5000
  eval_episodes: 3
  checkpoint_interval: 25000
  discount: 0.99

optim:
  lr: 0.0003
  grad_clip: 0.5
  weight_decay: 0.0
  eps: 1.0e-5

model:
  actor_hidden_dims: [256, 256]
  critic_hidden_dims: [256, 256]
  init_log_std: -0.5

algorithm:
  clip_ratio: 0.2
  gae_lambda: 0.95
  value_coef: 0.5
  entropy_coef: 0.0
  target_kl: 0.05
  normalize_advantages: true

logging:
  console_log_interval: 1000
  episode_log_interval: 10
  progress_interval: 500
  plot_interval: 5000
  enable_plots: true
