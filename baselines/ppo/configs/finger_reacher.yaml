experiment:
  algorithm: ppo
  name: ppo_finger_reacher
  output_dir: outputs
  seed: 7
  device: auto

benchmark:
  tasks:
    - id: finger_spin
      suite: dmcontrol
      domain: finger
      task: spin
      action_repeat: 2
      episode_length: 500
    - id: reacher_easy
      suite: dmcontrol
      domain: reacher
      task: easy
      action_repeat: 4
      episode_length: 200

training:
  total_steps: 100000
  rollout_steps: 2048
  minibatch_size: 256
  update_epochs: 10
  eval_interval: 5000
  eval_episodes: 3
  checkpoint_interval: 25000
  discount: 0.99

optim:
  lr: 0.00025
  grad_clip: 0.5
  weight_decay: 0.0
  eps: 1.0e-5

model:
  actor_hidden_dims: [256, 256]
  critic_hidden_dims: [256, 256]
  init_log_std: -0.7

algorithm:
  clip_ratio: 0.2
  gae_lambda: 0.95
  value_coef: 0.5
  entropy_coef: 0.001
  target_kl: 0.05
  normalize_advantages: true

logging:
  console_log_interval: 1000
  episode_log_interval: 10
  progress_interval: 500
  plot_interval: 5000
  enable_plots: true
