experiment:
  algorithm: sac
  name: sac_small_cartpole_swingup
  output_dir: outputs
  seed: 7
  device: auto

benchmark:
  tasks:
    - id: cartpole_swingup
      suite: dmcontrol
      domain: cartpole
      task: swingup
      action_repeat: 4
      episode_length: 200

training:
  total_steps: 100000
  # Low-budget setting with less aggressive update cadence and a longer random-data phase.
  seed_steps: 10000
  train_every: 4
  gradient_steps: 1
  batch_size: 128
  replay_capacity: 300000
  eval_interval: 5000
  eval_episodes: 3
  checkpoint_interval: 25000
  discount: 0.99

optim:
  lr: 0.0003
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  target_tau: 0.01
  weight_decay: 0.0

model:
  actor_hidden_dims: [64, 64]
  critic_hidden_dims: [64, 64]

algorithm:
  init_temperature: 0.1
  target_entropy_scale: 1.0
  actor_update_interval: 2
  target_update_interval: 2
  learnable_temperature: true

logging:
  console_log_interval: 1000
  episode_log_interval: 10
  progress_interval: 500
  plot_interval: 5000
  enable_plots: true
